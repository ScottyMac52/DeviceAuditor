name: Build and Release Single Exe

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine Version
        id: versioning
        shell: pwsh
        run: |
          $global:LASTEXITCODE = 0
          
          $latestTag = git describe --tags --abbrev=0 2>$null
          $global:LASTEXITCODE = 0
          
          if (-not $latestTag) { 
              $latestTag = "v3.10.0.0" 
          }
          
          $baseVer = $latestTag.TrimStart('v')
          
          # Normalize version to X.X.X.X
          $parts = $baseVer -split '\.'
          while ($parts.Count -lt 4) { $parts += '0' }
          if ($parts.Count -gt 4) { $parts = $parts[0..3] }
          
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2]
          $revision = [int]$parts[3]
          
          if ($env:GITHUB_REF -like "refs/tags/*") {
              # Tagged release: use tag version as X.X.X.X
              $asmVer = "$major.$minor.$patch.$revision"
              $fileVer = "$major.$minor.$patch.$revision"
          } else {
              # CI / manual run: add run number as the fourth version part
              $buildNum = [int]"${{ github.run_number }}"
              $asmVer = "$major.$minor.$patch.$buildNum"
              $fileVer = "$major.$minor.$patch.$buildNum"
          }
          
          Write-Output "VERSION=$asmVer" >> $env:GITHUB_OUTPUT
          Write-Output "FILE_VERSION=$fileVer" >> $env:GITHUB_OUTPUT
          
          Write-Host "Assembly/File Version: $asmVer"
          Write-Host "Detailed File Version: $fileVer"

      - name: Dotnet Publish
        run: |
          dotnet publish DeviceAuditor.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.versioning.outputs.VERSION }} `
            -p:FileVersion=${{ steps.versioning.outputs.FILE_VERSION }} `
            -p:AssemblyVersion=${{ steps.versioning.outputs.VERSION }} `
            -o ./publish

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          # No devices.json copy needed (it's embedded)
          if (Test-Path "./publish/devices.json") {
            Write-Warning "Unexpected devices.json in publish output — removing"
            Remove-Item "./publish/devices.json" -Force
          }
          
          Compress-Archive -Path "./publish/*" -DestinationPath "DeviceAuditor_v${{ steps.versioning.outputs.VERSION }}.zip" -Force

      - name: Create and Push Version Tag (if needed)
        shell: bash
        run: |
          TAG_NAME="v${{ steps.versioning.outputs.VERSION }}"
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists — skipping tag creation"
          else
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"
            echo "Created and pushed tag $TAG_NAME"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versioning.outputs.VERSION }}
          name: DeviceAuditor v${{ steps.versioning.outputs.VERSION }}
          body: |
            Automated build from commit ${{ github.sha }}
            
            ${{ github.event.head_commit.message || 'Manual trigger via workflow dispatch' }}
          generate_release_notes: true
          files: DeviceAuditor_v${{ steps.versioning.outputs.VERSION }}.zip
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
