name: Build and Release Single Exe

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    # Ignore triggers when only the workflow file is updated
    paths-ignore:
      - '.github/workflows/**'
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine Version
        id: versioning
        shell: pwsh
        run: |
          # Try to get the latest tag; if it fails, default to v3.10
          $latestTag = git describe --tags --abbrev=0 2>$null
          if (-not $latestTag) { 
              $latestTag = "v3.10" 
          }
          
          # Strip 'v' and prepare the base version
          $baseVer = $latestTag.TrimStart('v')
          
          if ($env:GITHUB_REF -like "refs/tags/*") {
              # If we pushed a tag (e.g., v3.11), use it exactly
              $finalVer = $baseVer
          } else {
              # Padded run number for dev builds: 3.10.002
              $runNumber = "${{ github.run_number }}".PadLeft(3, '0')
              $finalVer = "$baseVer.$runNumber"
          }
          
          # Use Add-Content for more reliable environment variable writing in Windows
          Add-Content -Path $env:GITHUB_OUTPUT -Value "VERSION=$finalVer"
          Write-Host "Determined Version: $finalVer"
          
      - name: Dotnet Publish
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:AssemblyVersion=${{ steps.versioning.outputs.VERSION }} `
          -p:FileVersion=${{ steps.versioning.outputs.VERSION }} `
          -o ./publish

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          Copy-Item "devices.json" -Destination "./publish/devices.json"
          Compress-Archive -Path "./publish/*" -DestinationPath "DeviceAuditor_v${{ steps.versioning.outputs.VERSION }}.zip"

      # --- NEW: GENERATE RELEASE NOTES ---
      - name: Generate Release Notes
        id: release_notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true # Automatically generates a list of commits
          tag_name: v${{ steps.versioning.outputs.VERSION }}
          name: DeviceAuditor v${{ steps.versioning.outputs.VERSION }}
          files: |
            DeviceAuditor_v${{ steps.versioning.outputs.VERSION }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
