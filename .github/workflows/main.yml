name: Build and Release Single Exe

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine Version
        id: versioning
        shell: pwsh
        run: |
          $latestTag = git describe --tags --abbrev=0 2>$null
          if ($null -eq $latestTag) { $latestTag = "v3.10" }
          
          $baseVer = $latestTag.TrimStart('v')
          
          if ($env:GITHUB_REF -like "refs/tags/*") {
              $finalVer = $baseVer
          } else {
              $runNumber = "${{ github.run_number }}".PadLeft(3, '0')
              $finalVer = "$baseVer.$runNumber"
          }
          
          echo "VERSION=$finalVer" >> $env:GITHUB_OUTPUT

      - name: Dotnet Publish
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:AssemblyVersion=${{ steps.versioning.outputs.VERSION }} `
          -p:FileVersion=${{ steps.versioning.outputs.VERSION }} `
          -o ./publish

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          Copy-Item "devices.json" -Destination "./publish/devices.json"
          Compress-Archive -Path "./publish/*" -DestinationPath "DeviceAuditor_v${{ steps.versioning.outputs.VERSION }}.zip"

      # --- NEW: GENERATE RELEASE NOTES ---
      - name: Generate Release Notes
        id: release_notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true # Automatically generates a list of commits
          tag_name: v${{ steps.versioning.outputs.VERSION }}
          name: DeviceAuditor v${{ steps.versioning.outputs.VERSION }}
          files: |
            DeviceAuditor_v${{ steps.versioning.outputs.VERSION }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
