name: Build and Release Single Exe + Setup

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release + push tag?'
        required: false
        default: false
        type: boolean

jobs:
  test:
    name: Run Unit Tests & Coverage
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Run Tests with Coverage
        run: |
          dotnet test TestDeviceAuditor/TestDeviceAuditor.csproj `
            --no-build `
            -c Release `
            --collect:"XPlat Code Coverage" `
            --results-directory ./coverage `
            --logger "console;verbosity=normal"

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate Coverage Report
        run: |
          reportgenerator -reports:./coverage/**/coverage.cobertura.xml `
                          -targetdir:./coverage/report `
                          -reporttypes:"Html;MarkdownSummaryGithub"

      - name: Publish Coverage Summary to Job Log
        run: |
          echo "## 📊 Code Coverage Report" >> $GITHUB_STEP_SUMMARY
          Get-Content ./coverage/report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Upload Full Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: ./coverage/report
          retention-days: 30

  release:
    name: Build & Release (with Setup.exe)
    runs-on: windows-latest
    needs: test
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine Version
        id: versioning
        shell: pwsh
        run: |
          $global:LASTEXITCODE = 0
          
          $latestTag = git describe --tags --abbrev=0 2>$null
          $global:LASTEXITCODE = 0
          
          if (-not $latestTag) { 
              $latestTag = "v3.10.0.0" 
          }
          
          $baseVer = $latestTag.TrimStart('v')
          
          $parts = $baseVer -split '\.'
          while ($parts.Count -lt 4) { $parts += '0' }
          if ($parts.Count -gt 4) { $parts = $parts[0..3] }
          
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2]
          $revision = [int]$parts[3]
          
          if ($env:GITHUB_REF -like "refs/tags/*") {
              $asmVer = "$major.$minor.$patch.$revision"
              $fileVer = "$major.$minor.$patch.$revision"
          } else {
              $buildNum = [int]"${{ github.run_number }}"
              $asmVer = "$major.$minor.$patch.$buildNum"
              $fileVer = "$major.$minor.$patch.$buildNum"
          }
          
          Write-Output "VERSION=$asmVer" >> $env:GITHUB_OUTPUT
          Write-Output "FILE_VERSION=$fileVer" >> $env:GITHUB_OUTPUT
          
          Write-Host "Assembly/File Version: $asmVer"

      - name: Dotnet Publish
        run: |
          dotnet publish DeviceAuditor\DeviceAuditor.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.versioning.outputs.VERSION }} `
            -p:FileVersion=${{ steps.versioning.outputs.FILE_VERSION }} `
            -p:AssemblyVersion=${{ steps.versioning.outputs.VERSION }} `
            -o ./publish

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Inject version and publisher into installer.iss
        shell: pwsh
        run: |
          $appName = "DeviceAuditor"
          $appPublisher = "ScottyMac52"
          $appVersion = "${{ steps.versioning.outputs.VERSION }}"

          Write-Host "=== Injecting into installer.iss ==="
          Write-Host "AppName: $appName"
          Write-Host "AppPublisher: $appPublisher"
          Write-Host "AppVersion: $appVersion"

          $issPath = "installer\installer.iss"
          $content = Get-Content $issPath -Raw

          $content = $content -replace '#define AppVersion "0.0.0"', "#define AppVersion `"$appVersion`""
          $content = $content -replace '#define AppPublisher "ScottyMac52"', "#define AppPublisher `"$appPublisher`""

          Set-Content -Path $issPath -Value $content -NoNewline

          Write-Host "Version and publisher injected into .iss"

      - name: Build Setup.exe
        shell: pwsh
        run: |
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $isccArgs = @(
            "/DPublishDir=./publish",
            "installer\installer.iss"
          )

          & $isccPath @isccArgs

          if ($LASTEXITCODE -ne 0) {
              Write-Error "ISCC.exe failed with exit code $LASTEXITCODE"
              exit 1
          }

      - name: Stage Setup.exe for release
        shell: pwsh
        run: |
          $version = "${{ steps.versioning.outputs.VERSION }}"
          $setupDir = "_setup"
          New-Item -ItemType Directory -Force -Path $setupDir | Out-Null

          $found = Get-ChildItem -Path . -Recurse -Filter "DeviceAuditor-Setup-*.exe" | Select-Object -First 1
          if ($found) {
              $target = Join-Path $setupDir "DeviceAuditor-Setup-v$version.exe"
              Move-Item -Path $found.FullName -Destination $target -Force

              Write-Host "✅ Setup.exe staged to $target"

              try {
                  $verInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($target)
                  Write-Host "Embedded ProductVersion: $($verInfo.ProductVersion)"
                  Write-Host "Embedded FileVersion:    $($verInfo.FileVersion)"
                  Write-Host "Embedded ProductName:    $($verInfo.ProductName)"
                  Write-Host "Embedded CompanyName:     $($verInfo.CompanyName)"
              } catch {
                  Write-Host "Could not read version info: $_"
              }
          } else {
              Write-Host "❌ No DeviceAuditor-Setup-*.exe found after ISCC!"
              if (Test-Path "installer") {
                  Write-Host "installer dir contents:"
                  Get-ChildItem installer | Format-Table Name, Length -AutoSize
              }
          }

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          if (Test-Path "./publish/devices.json") {
            Remove-Item "./publish/devices.json" -Force
          }
          Compress-Archive -Path "./publish/*" -DestinationPath "DeviceAuditor_v${{ steps.versioning.outputs.VERSION }}.zip" -Force

      - name: Upload build artifacts (always, for testing)
        uses: actions/upload-artifact@v4
        with:
          name: DeviceAuditor-build-v${{ steps.versioning.outputs.VERSION }}
          path: |
            DeviceAuditor_v${{ steps.versioning.outputs.VERSION }}.zip
            _setup/DeviceAuditor-Setup-v${{ steps.versioning.outputs.VERSION }}.exe
          retention-days: 30

      - name: Create and Push Version Tag (if needed)
        if: >-
          github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') ||
          github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
        shell: bash
        run: |
          TAG_NAME="v${{ steps.versioning.outputs.VERSION }}"
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists — skipping tag creation"
          else
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"
            echo "Created and pushed tag $TAG_NAME"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or Update GitHub Release
        if: >-
          github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') ||
          github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versioning.outputs.VERSION }}
          name: DeviceAuditor v${{ steps.versioning.outputs.VERSION }}
          body: |
            Automated build from commit ${{ github.sha }}
            
            ${{ github.event.head_commit.message || 'Manual trigger via workflow dispatch' }}
          generate_release_notes: true
          files: |
            DeviceAuditor_v${{ steps.versioning.outputs.VERSION }}.zip
            _setup/DeviceAuditor-Setup-v${{ steps.versioning.outputs.VERSION }}.exe
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}