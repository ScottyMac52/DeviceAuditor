name: Build and Release Single Exe

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Run Tests with Coverage
        run: |
          dotnet test DeviceAuditor.Tests/DeviceAuditor.Tests.csproj \
            --no-build \
            -c Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            --logger "console;verbosity=normal"

      - name: Generate Coverage Report
        run: |
          dotnet tool install --global dotnet-coverage
          dotnet-coverage report ./coverage/**/coverage.cobertura.xml -o ./coverage/report.html -f html
          dotnet-coverage report ./coverage/**/coverage.cobertura.xml -o ./coverage/summary.txt -f text

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: |
            ./coverage/report.html
            ./coverage/summary.txt
          retention-days: 30

      - name: Publish Test Coverage Summary
        uses: irongut/CodeCoverageSummary@v1
        with:
          filename: ./coverage/**/coverage.cobertura.xml
          badge: true
          fail_below_min: false
          format: markdown
          indicators: true
          thresholds: '70 80'

  release:
    name: Build & Release
    runs-on: windows-latest
    needs: test                    # ← This ensures tests run first
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine Version
        id: versioning
        shell: pwsh
        run: |
          # (Your existing versioning script - unchanged)
          $global:LASTEXITCODE = 0
          
          $latestTag = git describe --tags --abbrev=0 2>$null
          $global:LASTEXITCODE = 0
          
          if (-not $latestTag) { 
              $latestTag = "v3.10.0.0" 
          }
          
          $baseVer = $latestTag.TrimStart('v')
          
          $parts = $baseVer -split '\.'
          while ($parts.Count -lt 4) { $parts += '0' }
          if ($parts.Count -gt 4) { $parts = $parts[0..3] }
          
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2]
          $revision = [int]$parts[3]
          
          if ($env:GITHUB_REF -like "refs/tags/*") {
              $asmVer = "$major.$minor.$patch.$revision"
              $fileVer = "$major.$minor.$patch.$revision"
          } else {
              $buildNum = [int]"${{ github.run_number }}"
              $asmVer = "$major.$minor.$patch.$buildNum"
              $fileVer = "$major.$minor.$patch.$buildNum"
          }
          
          Write-Output "VERSION=$asmVer" >> $env:GITHUB_OUTPUT
          Write-Output "FILE_VERSION=$fileVer" >> $env:GITHUB_OUTPUT
          
          Write-Host "Assembly/File Version: $asmVer"

      - name: Dotnet Publish
        run: |
          dotnet publish DeviceAuditor\DeviceAuditor.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.versioning.outputs.VERSION }} `
            -p:FileVersion=${{ steps.versioning.outputs.FILE_VERSION }} `
            -p:AssemblyVersion=${{ steps.versioning.outputs.VERSION }} `
            -o ./publish

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          if (Test-Path "./publish/devices.json") {
            Write-Warning "Unexpected devices.json in publish output — removing"
            Remove-Item "./publish/devices.json" -Force
          }
          
          Compress-Archive -Path "./publish/*" -DestinationPath "DeviceAuditor_v${{ steps.versioning.outputs.VERSION }}.zip" -Force

      # ... rest of your release steps (tag + GitHub Release) remain unchanged
      - name: Create and Push Version Tag (if needed)
        shell: bash
        run: |
          TAG_NAME="v${{ steps.versioning.outputs.VERSION }}"
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists — skipping tag creation"
          else
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"
            echo "Created and pushed tag $TAG_NAME"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versioning.outputs.VERSION }}
          name: DeviceAuditor v${{ steps.versioning.outputs.VERSION }}
          body: |
            Automated build from commit ${{ github.sha }}
            
            ${{ github.event.head_commit.message || 'Manual trigger via workflow dispatch' }}
          generate_release_notes: true
          files: DeviceAuditor_v${{ steps.versioning.outputs.VERSION }}.zip
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
