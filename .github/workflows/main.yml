name: Build and Release Single Exe

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine Version
        id: versioning
        shell: pwsh
        run: |
          $global:LASTEXITCODE = 0
          
          $latestTag = git describe --tags --abbrev=0 2>$null
          $global:LASTEXITCODE = 0
          
          if (-not $latestTag) { 
              $latestTag = "v3.10.0" 
          }
          
          $baseVer = $latestTag.TrimStart('v')
          
          # Split base version into parts (assume major.minor[.patch])
          $parts = $baseVer -split '\.'
          while ($parts.Count -lt 3) { $parts += '0' }
          
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2]
          
          if ($env:GITHUB_REF -like "refs/tags/*") {
              # Tagged release: use base as-is (assume already 3 parts)
              $asmVer = "$major.$minor.$patch.0"
              $fileVer = "$major.$minor.$patch.0"
          } else {
              # CI build: add run number as build/revision
              $buildNum = [int]"${{ github.run_number }}"
              $asmVer = "$major.$minor.$patch.$buildNum"      # valid 4-part for AssemblyVersion
              $fileVer = "$major.$minor.$patch.$buildNum"     # or make more detailed if desired
          }
          
          # Optional: append commit short hash or date for FileVersion if you want more uniqueness
          # $shortHash = git rev-parse --short HEAD
          # $fileVer = "$major.$minor.$patch.$buildNum+$shortHash"
          
          Write-Output "VERSION=$asmVer" >> $env:GITHUB_OUTPUT
          Write-Output "FILE_VERSION=$fileVer" >> $env:GITHUB_OUTPUT
          
          Write-Host "Assembly/File Version: $asmVer"
          Write-Host "Detailed File Version: $fileVer"

      - name: Dotnet Publish
        run: |
          dotnet publish DeviceAuditor.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.versioning.outputs.VERSION }} `
            -p:FileVersion=${{ steps.versioning.outputs.FILE_VERSION }} `
            -p:AssemblyVersion=${{ steps.versioning.outputs.VERSION }} `
            -o ./publish

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          if (Test-Path "devices.json") {
            Copy-Item "devices.json" -Destination "./publish/devices.json" -Force
          } else {
            Write-Warning "devices.json not found in repo root - skipping copy"
          }
          Compress-Archive -Path "./publish/*" -DestinationPath "DeviceAuditor_v${{ steps.versioning.outputs.VERSION }}.zip" -Force

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: v${{ steps.versioning.outputs.VERSION }}
          name: DeviceAuditor v${{ steps.versioning.outputs.VERSION }}
          generate_release_notes: true
          files: DeviceAuditor_v${{ steps.versioning.outputs.VERSION }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
