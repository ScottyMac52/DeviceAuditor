name: Build and Release Single Exe

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    # Ignore triggers when only the workflow file is updated
    paths-ignore:
      - '.github/workflows/**'
  # Added ability to manually trigger the build from the Actions tab
  workflow_dispatch:
  
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine Version
        id: versioning
        shell: pwsh
        run: |
          # Robust check for latest tag, default to v3.10 if missing
          $latestTag = git describe --tags --abbrev=0 2>$null
          if (-not $latestTag) { 
              $latestTag = "v3.10" 
          }
          
          $baseVer = $latestTag.TrimStart('v')
          
          if ($env:GITHUB_REF -like "refs/tags/*") {
              $finalVer = $baseVer
          } else {
              # Format: 3.10.003
              $runNumber = "${{ github.run_number }}".PadLeft(3, '0')
              $finalVer = "$baseVer.$runNumber"
          }
          
          # Force UTF8 encoding to prevent Windows Runner exit errors
          $versionLine = "VERSION=$finalVer"
          [System.IO.File]::AppendAllLines($env:GITHUB_OUTPUT, [string[]]$versionLine)
          Write-Host "Determined Version: $finalVer"     
          
      - name: Dotnet Publish
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:AssemblyVersion=${{ steps.versioning.outputs.VERSION }} `
          -p:FileVersion=${{ steps.versioning.outputs.VERSION }} `
          -o ./publish

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          Copy-Item "devices.json" -Destination "./publish/devices.json"
          Compress-Archive -Path "./publish/*" -DestinationPath "DeviceAuditor_v${{ steps.versioning.outputs.VERSION }}.zip"

      # --- NEW: GENERATE RELEASE NOTES ---
      - name: Generate Release Notes
        id: release_notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true # Automatically generates a list of commits
          tag_name: v${{ steps.versioning.outputs.VERSION }}
          name: DeviceAuditor v${{ steps.versioning.outputs.VERSION }}
          files: |
            DeviceAuditor_v${{ steps.versioning.outputs.VERSION }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
